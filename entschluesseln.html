<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="dark">
<title>Geschützte Nachricht</title>
<style>
  :root {
    --ink: #0a0912;
    --panel: #14121f;
    --line: #2a2640;
    --text: #ebe8f7;
    --muted: #918bab;
    --violet: #8f6cf0;
    --pink: #d777cf;
    --error: #ff8197;
    --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --serif: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
  }

  * { box-sizing: border-box; }

  html, body { height: 100%; }

  body {
    margin: 0;
    padding: 2rem 1.25rem;
    background:
      radial-gradient(60rem 40rem at 90% -10%, rgba(143, 108, 240, 0.22), transparent 60%),
      radial-gradient(50rem 36rem at -10% 110%, rgba(215, 119, 207, 0.14), transparent 60%),
      var(--ink);
    color: var(--text);
    font-family: var(--sans);
    line-height: 1.5;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  main {
    width: 100%;
    max-width: 34rem;
  }

  h1 {
    margin: 0 0 0.5rem;
    font-family: var(--serif);
    font-weight: 600;
    font-size: clamp(1.9rem, 6vw, 2.6rem);
    line-height: 1.15;
    letter-spacing: -0.01em;
  }

  .hint {
    margin: 0 0 1.75rem;
    color: var(--muted);
    max-width: 30rem;
  }

  form {
    display: flex;
    gap: 0.6rem;
    flex-wrap: wrap;
  }

  input[type="password"] {
    flex: 1 1 14rem;
    min-width: 0;
    padding: 0.8rem 0.95rem;
    border: 1px solid var(--line);
    border-radius: 0.6rem;
    background: var(--panel);
    color: var(--text);
    font: inherit;
  }

  input[type="password"]::placeholder { color: var(--muted); }

  button {
    padding: 0.8rem 1.25rem;
    border: 0;
    border-radius: 0.6rem;
    background: var(--violet);
    color: #0d0a1a;
    font: inherit;
    font-weight: 600;
    cursor: pointer;
  }

  button:hover:not(:disabled) { background: #a285f5; }
  button:disabled, input:disabled { opacity: 0.55; cursor: not-allowed; }

  :focus-visible {
    outline: 2px solid var(--pink);
    outline-offset: 2px;
  }

  .fehler {
    margin: 1rem 0 0;
    color: var(--error);
    min-height: 1.5em;
  }

  .nachricht {
    margin-top: 1.75rem;
    padding: 1.25rem 1.35rem;
    border-left: 3px solid var(--violet);
    background: var(--panel);
    border-radius: 0 0.6rem 0.6rem 0;
    font-family: var(--serif);
    font-size: 1.2rem;
    line-height: 1.6;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
  }

  .nachricht[hidden], form[hidden] { display: none; }

  .klein {
    margin: 1.5rem 0 0;
    color: var(--muted);
    font-size: 0.875rem;
    max-width: 30rem;
  }
</style>
</head>
<body>
<main>
  <h1>Geschützte Nachricht</h1>
  <p class="hint" id="hinweis">Gib das Passwort ein, um die Nachricht zu lesen.</p>

  <form id="formular" autocomplete="off">
    <input type="password" id="passwort" placeholder="Passwort" aria-label="Passwort" required autofocus>
    <button type="submit" id="knopf">Nachricht lesen</button>
  </form>

  <p class="fehler" id="fehler" role="alert"></p>
  <div class="nachricht" id="nachricht" hidden></div>

  <p class="klein">Die Nachricht wird nur in deinem Browser entschlüsselt. Das Passwort wird nirgendwohin gesendet.</p>
</main>

<script>
(function () {
  var formular = document.getElementById("formular");
  var feld = document.getElementById("passwort");
  var knopf = document.getElementById("knopf");
  var fehler = document.getElementById("fehler");
  var ausgabe = document.getElementById("nachricht");
  var hinweis = document.getElementById("hinweis");

  var daten = null;

  function base64urlZuBytes(s) {
    s = s.replace(/-/g, "+").replace(/_/g, "/");
    while (s.length % 4) s += "=";
    var bin = atob(s);
    var bytes = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    return bytes;
  }

  function sperren(text) {
    hinweis.textContent = text;
    formular.hidden = true;
  }

  // Nachricht steht hinter dem # im Link und wird nie an einen Server gesendet
  try {
    var teil = location.hash.slice(1);
    if (!teil) {
      sperren("Dieser Link enthält keine Nachricht. Öffne ihn direkt aus dem Chat.");
    } else {
      daten = base64urlZuBytes(teil);
      if (daten.length < 29) throw new Error("zu kurz");
    }
  } catch (e) {
    daten = null;
    sperren("Der Link ist unvollständig oder beschädigt. Kopiere ihn noch einmal aus dem Chat.");
  }

  if (!window.crypto || !window.crypto.subtle) {
    sperren("Dein Browser unterstützt die Entschlüsselung nicht. Nutze einen aktuellen Browser über https.");
  }

  async function entschluesseln(passwort, bytes) {
    var enc = new TextEncoder();
    var basis = await crypto.subtle.importKey("raw", enc.encode(passwort), "PBKDF2", false, ["deriveKey"]);
    var schluessel = await crypto.subtle.deriveKey(
      { name: "PBKDF2", salt: enc.encode("MeinPlugin-v1"), iterations: 100000, hash: "SHA-256" },
      basis,
      { name: "AES-GCM", length: 256 },
      false,
      ["decrypt"]
    );
    var klar = await crypto.subtle.decrypt(
      { name: "AES-GCM", iv: bytes.slice(0, 12) },
      schluessel,
      bytes.slice(12)
    );
    return new TextDecoder().decode(klar);
  }

  formular.addEventListener("submit", async function (ev) {
    ev.preventDefault();
    if (!daten || !feld.value) return;

    fehler.textContent = "";
    knopf.disabled = true;
    feld.disabled = true;
    knopf.textContent = "Entschlüssele …";

    try {
      var text = await entschluesseln(feld.value, daten);
      ausgabe.textContent = text;
      ausgabe.hidden = false;
      formular.hidden = true;
      hinweis.textContent = "Die Nachricht wurde entschlüsselt.";
    } catch (e) {
      fehler.textContent = "Falsches Passwort. Prüfe die Eingabe und versuche es noch einmal.";
      feld.value = "";
    } finally {
      knopf.disabled = false;
      feld.disabled = false;
      knopf.textContent = "Nachricht lesen";
      if (!formular.hidden) feld.focus();
    }
  });
})();
</script>
</body>
</html>
